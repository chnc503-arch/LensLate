[versions]
agp                 = "8.5.2"
kotlin              = "2.0.20"
kapt                = "2.0.20"
hilt                = "2.51.1"
compose-bom         = "2024.09.00"
activity-compose    = "1.9.2"
lifecycle           = "2.8.5"
navigation          = "2.8.1"
mlkit-ocr-latin     = "19.0.1"
mlkit-ocr-japanese  = "16.0.1"
mlkit-translate     = "17.0.3"
mlkit-language-id   = "17.0.6"
coroutines          = "1.8.1"
coil                = "2.7.0"
work                = "2.9.1"
hilt-work           = "1.2.0"
core-ktx            = "1.13.1"
exifinterface       = "1.3.7"

[libraries]
# Compose
compose-bom                  = { group = "androidx.compose",          name = "compose-bom",                           version.ref = "compose-bom" }
compose-ui                   = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling-preview   = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling           = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3            = { group = "androidx.compose.material3", name = "material3" }
compose-icons-extended       = { group = "androidx.compose.material",  name = "material-icons-extended" }
activity-compose             = { group = "androidx.activity",          name = "activity-compose",                      version.ref = "activity-compose" }

# Lifecycle / Navigation
lifecycle-viewmodel-compose  = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose",           version.ref = "lifecycle" }
lifecycle-runtime-ktx        = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",                 version.ref = "lifecycle" }
navigation-compose           = { group = "androidx.navigation",        name = "navigation-compose",                    version.ref = "navigation" }

# Core
core-ktx                     = { group = "androidx.core",              name = "core-ktx",                              version.ref = "core-ktx" }
exifinterface                = { group = "androidx.exifinterface",       name = "exifinterface",                         version.ref = "exifinterface" }

# ML Kit
mlkit-ocr-latin              = { group = "com.google.android.gms",     name = "play-services-mlkit-text-recognition",          version.ref = "mlkit-ocr-latin" }
mlkit-ocr-japanese           = { group = "com.google.android.gms",     name = "play-services-mlkit-text-recognition-japanese",  version.ref = "mlkit-ocr-japanese" }
mlkit-translate              = { group = "com.google.mlkit",           name = "translate",                             version.ref = "mlkit-translate" }
mlkit-language-id            = { group = "com.google.mlkit",           name = "language-id",                           version.ref = "mlkit-language-id" }

# Coroutines
coroutines-android           = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",            version.ref = "coroutines" }
coroutines-play-services     = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-play-services",      version.ref = "coroutines" }

# Coil
coil-compose                 = { group = "io.coil-kt",                 name = "coil-compose",                          version.ref = "coil" }

# WorkManager
work-runtime-ktx             = { group = "androidx.work",              name = "work-runtime-ktx",                      version.ref = "work" }
hilt-work                    = { group = "androidx.hilt",              name = "hilt-work",                             version.ref = "hilt-work" }
hilt-work-compiler           = { group = "androidx.hilt",              name = "hilt-compiler",                         version.ref = "hilt-work" }

# Hilt
hilt-android                 = { group = "com.google.dagger",          name = "hilt-android",                          version.ref = "hilt" }
hilt-compiler                = { group = "com.google.dagger",          name = "hilt-compiler",                         version.ref = "hilt" }
hilt-navigation-compose      = { group = "androidx.hilt",              name = "hilt-navigation-compose",               version = "1.2.0" }

[plugins]
android-application          = { id = "com.android.application",       version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",  version.ref = "kotlin" }
kotlin-kapt                  = { id = "org.jetbrains.kotlin.kapt",     version.ref = "kapt" }
kotlin-compose               = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                         = { id = "com.google.dagger.hilt.android",version.ref = "hilt" }
